services:
  bot:
    build: .
    image: okx-trading-bot:latest
    container_name: okx-trading-bot
    restart: always
    env_file: .env
    environment:
      TZ: UTC
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data        # SQLite со сделками и состоянием, кэш истории
      - ./logs:/app/logs        # логи с ротацией
      - ./reports:/app/reports  # отчёты бэктеста
    stop_grace_period: 30s      # время на корректную остановку (позиции остаются со SL/TP на бирже)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
