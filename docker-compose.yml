# Локальная PostgreSQL для разработки: npm run db:up
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meowgul
      POSTGRES_PASSWORD: meowgul
      POSTGRES_DB: meowgul
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meowgul']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
