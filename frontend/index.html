    />
    <meta name="theme-color" content="#02030a" />
    <meta name="color-scheme" content="dark" />
    <title>Meowgul</title>
    <meta
      name="description"
      content="Тапай кота, прокачивай компанию и зарабатывай PAW. Black cat crypto tycoon."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Meowgul — black cat crypto tycoon" />
    <meta property="og:description" content="Тапай кота, строй криптокомпанию и зови друзей." />
    <meta property="og:image" content="/assets/generated/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/assets/generated/favicon-64.png" />
    <link rel="apple-touch-icon" href="/assets/generated/icon-192.png" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/assets/generated/character-512.webp"
      imagesrcset="/assets/generated/character-512.webp 1x, /assets/generated/character-1024.webp 2x"
    />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      /* критический CSS: фон и сплэш видны до загрузки бандла */
      html,
      body {
        margin: 0;
        background: #02030a;
        color: #fff;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #02030a 0%, #040612 55%, #02030a 100%);
      }
      #boot img {
        width: 168px;
        height: 168px;
        border-radius: 50%;
        object-fit: cover;
        object-position: 50% 50%;
        box-shadow:
          0 0 0 4px #ffc93c,
          0 0 48px rgba(255, 138, 61, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <picture>
          <source
            type="image/webp"
            srcset="/assets/generated/character-512.webp 1x, /assets/generated/character-1024.webp 2x"
          />
          <img src="/assets/generated/character-512.png" alt="" width="168" height="168" />
        </picture>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
